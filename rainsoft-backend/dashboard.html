<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainsoft GastKompass</title><style>body{font:16px system-ui,Arial;margin:0;background:#f4f8f5;color:#183c2c}header{background:#174531;color:#fff;padding:18px}main{max-width:850px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:14px;border:1px solid #dae5dc;margin:12px 0}h1{margin:12px 0}label{display:block;margin:8px 0}input,textarea{width:100%;padding:10px;border:1px solid #a8b8ac;border-radius:6px;box-sizing:border-box;font:inherit}textarea{min-height:80px}button{background:#197647;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font:inherit}#msg{padding:10px;color:#8d2626}.hidden{display:none}</style></head><body><header>Rainsoft Johann Prem · GastKompass</header><main><h1 id="title">Deine digitale Gästemappe</h1><div id="msg" role="status"></div><div id="login" class="card"><h2>Gastgeber-Anmeldung</h2><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">Anmelden</button></div><div id="editor" class="hidden"><div class="card"><h2>Informationen bearbeiten</h2><label>Anreise<textarea id="arrival"></textarea></label><label>Parkplatz<textarea id="parking"></textarea></label><label>WLAN-Hinweis<textarea id="wifi_info"></textarea></label><label>Hausregeln<textarea id="house_rules"></textarea></label><label>Zusatzangebote<textarea id="extras"></textarea></label><button id="save">Änderungen speichern</button> <button id="subscribe" type="button">Abo prüfen</button> <button id="signOut">Abmelden</button></div></div><div class="card"><h2>Gästelink und QR-Code</h2><p id="link-area">Bitte anmelden.</p><img id="qr" alt="QR-Code zur Gästeansicht" width="160" height="160" hidden><p>Der öffentliche Link funktioniert erst mit aktivem, bestätigtem Abonnement.</p></div><div class="card"><h2>Öffentliche Gästeansicht</h2><div id="preview">Noch keine freigeschaltete Gästemappe.</div></div></main><script>
const tenant=new URLSearchParams(location.search).get("tenant")||"";
const names=["arrival","parking","wifi_info","house_rules","extras"];const root="/api/host/"+encodeURIComponent(tenant);
const msg=x=>document.getElementById("msg").textContent=x;
async function req(url,method="GET",body){let options={method,credentials:"same-origin",headers:{}};if(body){options.headers["Content-Type"]="application/json";options.body=JSON.stringify(body)}const r=await fetch(url,options);const result=await r.json().catch(()=>({}));if(!r.ok)throw Error(result.error||"Anfrage fehlgeschlagen ("+r.status+")");return result;}
async function load(){if(!/^[A-Za-z0-9_-]{3,64}$/.test(tenant)){msg("Ungültige Unterkunftskennung");return}try{const data=await req(root+"/guide");names.forEach(k=>document.getElementById(k).value=data.guest_info[k]||"");document.getElementById("login").classList.add("hidden");document.getElementById("editor").classList.remove("hidden");document.getElementById("title").textContent=data.display_name;const guestUrl=location.origin+"/g/"+encodeURIComponent(tenant);const a=document.createElement("a");a.href=guestUrl;a.textContent=guestUrl;document.getElementById("link-area").replaceChildren(a);document.getElementById("qr").src=root+"/qr.svg";document.getElementById("qr").hidden=false;msg("");}catch(e){document.getElementById("login").classList.remove("hidden");document.getElementById("editor").classList.add("hidden")}}
document.getElementById("signIn").onclick=async()=>{try{await req(root+"/login","POST",{password:document.getElementById("password").value});document.getElementById("password").value="";await load()}catch(e){msg(e.message)}};
document.getElementById("save").onclick=async()=>{try{await req(root+"/guide","PUT",Object.fromEntries(names.map(k=>[k,document.getElementById(k).value])));msg("Gespeichert")}catch(e){msg(e.message)}};
document.getElementById("subscribe").onclick=async()=>{try{const data=await req(root+"/subscribe","POST",{});if(!data.approval_url||!data.approval_url.startsWith("https://www.paypal.com/")&&!data.approval_url.startsWith("https://www.sandbox.paypal.com/"))throw Error("Ungültige Zahlungsadresse");location.assign(data.approval_url)}catch(e){msg(e.message)}};
document.getElementById("signOut").onclick=async()=>{await req(root+"/logout","POST",{}).catch(()=>{});await load()};
(async()=>{await load();try{const d=await req("/api/guest/"+encodeURIComponent(tenant));document.getElementById("preview").replaceChildren(...names.map(k=>{const div=document.createElement("p");div.textContent=k.replace("_"," ")+": "+(d.guest_info[k]||"–");return div}))}catch(e){document.getElementById("preview").textContent="Nur bei aktivem, bezahltem Abonnement öffentlich sichtbar."}})();
</script></body></html>
