name: Notify IndexNow for book pages
on:
  push:
    branches: [main]
    paths:
      - buecher-johann-prem.html
      - auswandern-ungarn-rentner-2027.html
      - ungarn-2027-budgetrechner.html
      - ungarn-2027-krankenversicherung-s1-rentner.html
      - auswandern-griechenland-rentner-2027.html
      - .github/workflows/indexnow-books.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-bookpages
  cancel-in-progress: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify published key and notify five book information pages
        shell: bash
        run: |
          set -euo pipefail
          KEY="6c55801bf1e6b26751e88c0f4b1274ef"
          LOCATION="https://topdiveair-sketch.github.io/Gaeste/${KEY}.txt"
          HOSTED_KEY="$(curl --silent --show-error --location --max-time 20 "${LOCATION}")"
          if [ "${HOSTED_KEY}" != "${KEY}" ]; then
            echo "IndexNow key not yet public or incorrect."
            exit 1
          fi
          count=0
          for PAGE in buecher-johann-prem.html auswandern-ungarn-rentner-2027.html ungarn-2027-budgetrechner.html ungarn-2027-krankenversicherung-s1-rentner.html auswandern-griechenland-rentner-2027.html; do
            HTTP_CODE="$(curl --silent --show-error --max-time 20 --get \
              --data-urlencode "url=https://topdiveair-sketch.github.io/Gaeste/${PAGE}" \
              --data-urlencode "key=${KEY}" \
              --data-urlencode "keyLocation=${LOCATION}" \
              --output /tmp/indexnow-response --write-out "%{http_code}" \
              https://api.indexnow.org/indexnow)"
            echo "${PAGE}: IndexNow HTTP ${HTTP_CODE}"
            case "${HTTP_CODE}" in
              200|202) count=$((count+1)) ;;
              *) cat /tmp/indexnow-response; exit 1 ;;
            esac
          done
          echo "IndexNow notifications submitted: ${count}. This is not proof of search indexing."
