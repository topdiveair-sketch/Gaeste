name: Import author book covers from legacy listings
on:
  push:
    branches: [main]
    paths:
      - scripts/import-existing-book-covers.py
      - .github/workflows/import-original-covers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-book-cover-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out author's book catalog
        uses: actions/checkout@v4
      - name: Install small image-check dependency
        run: python3 -m pip install --quiet pillow
      - name: Validate image/ASIN mapping and import covers
        run: python3 scripts/import-existing-book-covers.py
      - name: Commit only verified local cover images and catalog metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ebooks/legacy-*.jpg prem-digital-katalog.json prem-digital-editionen.html marketing/cover-import-report.json
          if git diff --cached --quiet; then
            echo "No new verified book covers available"
          else
            git commit -m "Import validated legacy author book covers as own local assets"
            git push
          fi
