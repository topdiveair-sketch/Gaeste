<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkedIn Wachstumscockpit</title><style>body{background:#101820;color:#eee;font:16px system-ui;max-width:900px;margin:35px auto;padding:20px}h1{color:#7dc5ff}#metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}article{background:#1c2934;padding:20px;border-radius:12px}strong{display:block;font-size:32px;margin-top:8px}small,p{color:#c3d0db}a{color:#7dc5ff}</style><h1>LinkedIn · Wachstumscockpit</h1><h2>Johann Prem – Autor & Schriftsteller</h2><p id="meta">Lade Daten …</p><div id="metrics"></div><p id="note"></p><small>Abfrage alle 60 Sekunden. Datenstand hängt von der Übertragung aus Metricool ab.</small><p><a href="https://app.metricool.com/">Metricool öffnen</a></p><script>async function refresh(){try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.getElementById('meta').textContent=d.period+' | Stand: '+d.asOf+' | '+d.source;const m=document.getElementById('metrics');m.replaceChildren();for(const [k,v] of Object.entries(d.metrics)){const a=document.createElement('article');a.append(k);const s=document.createElement('strong');s.textContent=v??'—';a.append(s);m.append(a)}document.getElementById('note').textContent=d.note}catch(e){document.getElementById('note').textContent='Abruffehler: '+e.message}}refresh();setInterval(refresh,60000)</script></html>
