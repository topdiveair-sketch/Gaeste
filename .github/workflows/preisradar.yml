name: Melk Preisradar - Tagespreise
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aktuelle Online-Produktpreise pruefen
        run: python preisradar/update_prices.py
      - name: Nur geaenderte Preisdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preisradar/online-preise.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Melk price radar online checks"
            git push
          fi
