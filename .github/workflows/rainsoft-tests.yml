name: Rainsoft backend security tests
on:
  pull_request:
    paths:
      - 'rainsoft-backend/**'
      - '.github/workflows/rainsoft-tests.yml'
  push:
    branches:
      - feature/rainsoft-checkout-20261009
    paths:
      - 'rainsoft-backend/**'
      - '.github/workflows/rainsoft-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rainsoft-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q .
      - name: Run Rainsoft tests
        run: python -m unittest discover -v -p 'test_*.py'
