<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Cockpit</title><style>body{background:#101820;color:#eee;font:16px system-ui;max-width:1000px;margin:35px auto;padding:20px}h1{color:#7dc5ff}section{background:#1c2934;padding:20px;border-radius:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}article{background:#263746;padding:15px;border-radius:8px}strong{display:block;font-size:30px;margin-top:8px}small,p{color:#c3d0db}a{color:#7dc5ff}</style><h1>Social Media · Wachstumscockpit</h1><p id="meta">Lade Daten …</p><main id="platforms"></main><small>Abfrage alle 60 Sekunden. Fehlende Daten = —. Keine automatisierte Datenübertragung bestätigt.</small><p><a href="https://app.metricool.com/">Metricool öffnen</a></p><script>async function refresh(){try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.getElementById('meta').textContent=d.period+' | Stand: '+d.asOf+' | '+d.source;const root=document.getElementById('platforms');root.replaceChildren();for(const [name,data] of Object.entries(d.platforms)){const sec=document.createElement('section'),h=document.createElement('h2'),g=document.createElement('div'),p=document.createElement('p');h.textContent=name;g.className='grid';for(const [k,v] of Object.entries(data.metrics)){const a=document.createElement('article'),s=document.createElement('strong');a.append(k);s.textContent=v??'—';a.append(s);g.append(a)}p.textContent=data.note;sec.append(h,g,p);root.append(sec)}}catch(e){document.getElementById('meta').textContent='Abruffehler: '+e.message}}refresh();setInterval(refresh,60000)</script></html>
