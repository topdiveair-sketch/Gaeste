<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digitale Gästemappe · Rainsoft</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183d30;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#164333,#287c56);color:white;padding:38px 20px}header div,main,footer{max-width:870px;margin:auto}h1{font-size:clamp(30px,5vw,44px);margin:8px 0}main{padding:25px 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{background:white;border:1px solid #d7e6da;padding:20px;border-radius:15px}h2{font-size:18px;margin:0 0 8px}.tile p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.notice{background:#fff8df;border:1px solid #eadbab;border-radius:10px;padding:14px}footer{padding:20px;color:#647468;font-size:13px}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><header><div><small>Rainsoft · Digitaler Gästebegleiter</small><h1 id="name">Willkommen!</h1><p>Informationen für einen angenehmen Aufenthalt.</p></div></header><main><p id="status" role="status">Informationen werden geladen …</p><div class="grid" id="content" hidden></div></main><footer>Die Inhalte werden vom jeweiligen Gastgeber gepflegt. Bitte bei Unklarheiten direkt an die Unterkunft wenden.</footer><script>
const names=[["arrival","🕒 Anreise"],["parking","🚗 Anfahrt & Parken"],["wifi_info","📶 WLAN"],["house_rules","🏡 Hausregeln"],["extras","☕ Zusatzangebote"]];
(async()=>{const tenant=decodeURIComponent(location.pathname.split("/").pop()||"");const status=document.getElementById("status");if(!/^[A-Za-z0-9_-]{3,64}$/.test(tenant)){status.textContent="Ungültiger Link.";return}try{const response=await fetch("/api/guest/"+encodeURIComponent(tenant),{cache:"no-store"});if(!response.ok)throw Error("Diese Gästemappe ist zurzeit nicht verfügbar.");const data=await response.json();document.getElementById("name").textContent=data.display_name;document.title=data.display_name+" · Gästemappe";const container=document.getElementById("content");for(const [key,label] of names){const val=data.guest_info?.[key];if(typeof val!=="string"||!val.trim())continue;const section=document.createElement("section"),h=document.createElement("h2"),p=document.createElement("p");section.className="tile";h.textContent=label;p.textContent=val;section.append(h,p);container.append(section)}if(!container.childElementCount){status.className="notice";status.textContent="Dein Gastgeber hat noch keine Informationen hinterlegt."}else{status.hidden=true;container.hidden=false}}catch(e){status.className="notice";status.textContent=e.message}})();
</script></body></html>
