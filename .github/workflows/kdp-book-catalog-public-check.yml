name: KDP book catalog public check
on:
  push:
    branches: [main]
    paths:
      - index.html
      - buecher-johann-prem.html
      - buecher.html
      - books.html
      - scripts/check-book-catalog.py
      - .github/workflows/kdp-book-catalog-public-check.yml
  schedule:
    - cron: '20 7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated public book catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-book-catalog.py
      - name: Verify published catalogs and navigation
        shell: bash
        run: |
          set -euo pipefail
          public_dir=$(mktemp -d)
          trap 'rm -rf "$public_dir"' EXIT
          for page in index.html buecher-johann-prem.html buecher.html books.html; do
            echo "Fetching public page: $page"
            curl --fail --location --silent --show-error --retry 2 --retry-delay 3 --max-time 30 \
              -o "$public_dir/$page" "https://topdiveair-sketch.github.io/Gaeste/$page"
          done
          python3 scripts/check-book-catalog.py --root "$public_dir"
          echo "Verified public catalog; check only, no edits to KDP or prices."
