<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Methusalem-Code | Produktionscockpit</title><style>body{background:#101820;color:#eee;font:16px system-ui;max-width:760px;margin:40px auto;padding:20px}h1{color:#e7c68a}section{background:#1c2934;padding:22px;border-radius:12px;margin:16px 0}progress{width:100%;height:20px;accent-color:#e7c68a}small{color:#bbc6cf}p{line-height:1.6}</style><h1>INTEGRATRON</h1><h2>Der Methusalem-Code · Produktionscockpit</h2><section id="status">Lade bestätigte Daten …</section><small>Abfrage alle 60 Sekunden. Keine simulierten Fortschritte. Nur öffentliche Statusdaten, kein Manuskript.</small><script>async function refresh(){const el=document.getElementById('status');try{const r=await fetch('./progress.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();el.replaceChildren();function line(t,v,m){const p=document.createElement('p');p.textContent=t+' – '+v+' / '+m;const b=document.createElement('progress');b.max=m;b.value=v;el.append(p,b)}line('Kapitel-Rohfassung',d.draftChapters,30);line('Überarbeitete Abschnitte (Entwurf)',d.revisedSections,d.totalSections);line('Freigegebene Illustrationen',d.illustrations,d.totalSections);for(const t of ['Wörter: '+(d.wordCount??'nicht gemessen'),'Stand: '+d.asOf,'Qualitätsprüfungen: '+(d.checks.join(', ')||'noch offen'),d.note]){const p=document.createElement('p');p.textContent=t;el.append(p)}}catch(e){el.textContent='Statusdaten derzeit nicht abrufbar: '+e.message}}refresh();setInterval(refresh,60000)</script></html>
