name: Cleanup guest app canonical data

on:
  push:
    paths:
      - '.github/workflows/cleanup-gaeste-canonical.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical lodging data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('content="Wachau-Gästeguide von Zuhause am Bach in Aggsbach Markt:', 'content="Wachau-Gästeguide von Zuhause am Bach – Wachau in Aggsbach Markt:')
          s = s.replace('content="Zuhause am Bach"', 'content="Zuhause am Bach – Wachau"')
          s = s.replace('"name":"Zuhause am Bach",', '"name":"Zuhause am Bach – Wachau",')
          s = s.replace('"dateModified":"2026-08-10"', '"dateModified":"2026-09-02"')
          s = s.replace('Welterbesteig-Wanderer, Donauradweg-Radfahrer, Familien und Ruhesuchende', 'Welterbesteig-Wanderer, Donauradweg-Radfahrer, Aktivgäste und Ruhesuchende')
          s = s.replace('href="https://topdiveair-sketch.github.io/Direcktbuchungen/index"', 'href="https://topdiveair-sketch.github.io/Direcktbuchungen/"')
          s = s.replace('<span>✅ Sofortige Bestätigung</span>', '<span>✅ Direkt bei den Gastgebern</span>')

          replacement = '''<section id="zimmer" class="card">
  <div class="kicker">🛏️ Zimmer</div>
  <h2>Bachblick – unser aktuell buchbares Zimmer</h2>
  <div class="room-grid">
    <article><h3>🌿 Bachblick</h3><p>Gemütliches Doppelzimmer für maximal zwei Personen. Das eigene private Badezimmer liegt direkt gegenüber und ist nicht ensuite.</p></article>
  </div>
</section>'''
          s, n = re.subn(r'<section id="zimmer" class="card">.*?</section>', replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Zimmer-Abschnitt nicht eindeutig gefunden')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix guest app room and canonical lodging data"
          git push
