name: Import ISBN-matched book covers
on:
  push:
    branches: [main]
    paths:
      - scripts/import-isbn-book-covers.py
      - .github/workflows/import-isbn-book-covers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isbn-book-cover-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install cover validation dependency
        run: python3 -m pip install --quiet pillow
      - name: Download and validate ISBN-matched covers
        run: python3 scripts/import-isbn-book-covers.py
      - name: Save validated images and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/ebooks prem-digital-katalog.json prem-digital-editionen.html marketing/isbn-cover-import-report.json
          if git diff --cached --quiet; then
            echo "No new matching book covers"
          else
            git commit -m "Import verified ISBN-linked book cover photos"
            git push
          fi
