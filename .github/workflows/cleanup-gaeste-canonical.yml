name: Cleanup guest app canonical data

on:
  push:
    paths:
      - '.github/workflows/cleanup-gaeste-canonical.yml'
      - 'scripts/cleanup_gaeste.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical lodging data
        run: python scripts/cleanup_gaeste.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix guest app room and canonical lodging data"
          git push
