<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Control Center</title><style>body{background:#101820;color:#eee;font:16px system-ui;max-width:1000px;margin:35px auto;padding:20px}h1{color:#e7c68a}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}article{background:#1c2934;padding:22px;border-radius:12px}a{color:#7dc5ff}small,p{color:#bbc6cf}.ok{color:#8ed4a1}.warn{color:#ffd080}</style><h1>Business Control Center</h1><p>Johann Prem · Projektübersicht</p><main id="cards"></main><p id="updated"></p><small>Öffentliche Übersicht ohne private Finanzdaten. Aktualisierung alle 60 Sekunden. Erreichbarkeit einer Statusdatei ist kein Nachweis einer laufenden Automatisierung.</small><script>const items=[['Buchproduktion','../methusalem/','../methusalem/progress.json'],['Social Media','../social/','../social/status.json'],['LinkedIn','../linkedin/','../linkedin/status.json'],['Rainsoft Book',null,null],['epubli',null,null],['Zuhause am Bach','https://www.zuhauseambach-wachau.at/',null],['Finanzübersicht',null,null],['Systemüberwachung',null,null]];async function refresh(){const root=document.getElementById('cards');root.replaceChildren();for(const [name,url,data] of items){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=name;a.append(h,p);if(url){const l=document.createElement('a');l.href=url;l.textContent='Öffnen';a.append(l)}root.append(a);if(!data){p.textContent='Datenanbindung offen';p.className='warn';continue}try{const r=await fetch(data+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();p.textContent='Statusdatei erreichbar · Stand '+(d.asOf||'unbekannt')+' · automatische Übertragung unbestätigt';p.className='warn'}catch(e){p.textContent='Statusabruf fehlgeschlagen';p.className='warn'}}document.getElementById('updated').textContent='Letzte Browserprüfung: '+new Date().toLocaleString('de-AT')}refresh();setInterval(refresh,60000)</script></html>
