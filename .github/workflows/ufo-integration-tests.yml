name: UFO Reader Stripe fulfillment safety tests

on:
  push:
    branches:
      - feature/ufo-stripe-systeme-fulfillment-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Offline webhook validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rainsoft-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rainsoft-backend/requirements.txt
      - name: Install test-only dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile integration and tests
        run: python -m py_compile app.py ufo_fulfillment.py tests/test_ufo_fulfillment.py
      - name: Run mock safety tests (no network or live payments)
        run: python -m unittest discover -s tests -p 'test_ufo_fulfillment.py' -v
