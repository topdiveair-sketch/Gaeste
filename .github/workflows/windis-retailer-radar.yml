name: Windis Buch-Radar - Vertriebskontrolle
on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/windis-retailer-radar.py'
      - 'scripts/test-windis-retailer-radar.py'
      - '.github/workflows/windis-retailer-radar.yml'
permissions:
  contents: write
concurrency:
  group: windis-retailer-radar-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline-Regressionspruefung
        run: python3 scripts/test-windis-retailer-radar.py
      - name: Bekannte Haendlerlinks pruefen und Historie fortschreiben
        run: python3 scripts/windis-retailer-radar.py
      - name: Gesicherte Ergebnisse aktualisieren
        run: |
          git add windis-radar.json
          if git diff --cached --quiet; then
            echo "Keine Datenveraenderungen."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: Windis Buch-Radar Tagespruefung [skip ci]"
          git push origin HEAD:main
